<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Bug Whisperer - Loading Screen Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 390px; min-height: 844px;
  background: #1a1612; font-family: 'Inter', sans-serif;
  color: #d4c5a9; overflow: hidden; position: relative;
}
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px 8px; font-size: 14px; font-weight: 600; color: #fff;
}
.status-bar-right { display: flex; gap: 6px; align-items: center; }
.nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; border-bottom: 1px solid #3d3425;
  background: rgba(26,22,18,0.8); backdrop-filter: blur(12px);
}
.nav-brand { display: flex; align-items: center; gap: 8px; }
.nav-logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #8b7355, #e8d5a3);
  display: flex; align-items: center; justify-content: center;
}
.nav-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: #e8d5a3; }
/* Content */
.content {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; text-align: center;
}
/* Magnifying glass */
.mag-container { position: relative; width: 120px; height: 120px; margin-bottom: 40px; }
.mag-ring {
  position: absolute; border-radius: 50%;
  border: 2px solid rgba(139,115,85,0.3);
  animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
}
.mag-ring:nth-child(1) { inset: 0; }
.mag-ring:nth-child(2) { inset: 10px; animation-delay: 0.5s; }
.mag-core {
  position: absolute; inset: 20px; border-radius: 50%;
  background: #2a2318; border: 1px solid #3d3425;
  display: flex; align-items: center; justify-content: center;
}
@keyframes ping {
  0% { transform: scale(1); opacity: 0.5; }
  75%, 100% { transform: scale(1.5); opacity: 0; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
/* Steps */
.steps { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 280px; }
.step {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 14px; transition: all 0.5s;
}
.step-done { color: #8b7355; opacity: 0.7; }
.step-active { color: #e8d5a3; opacity: 1; }
.step-pending { color: rgba(154,139,111,0.3); opacity: 0.4; }
.step-dot {
  width: 14px; height: 14px; display: flex; align-items: center; justify-content: center;
}
.step-check { color: #22c55e; font-size: 14px; }
.step-active-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #e8d5a3;
  animation: pulse 1.5s ease-in-out infinite;
}
.step-circle {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(154,139,111,0.3);
}
/* Loading text */
.loading-text {
  margin-top: 40px; font-size: 12px; color: rgba(154,139,111,0.5);
  animation: pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<div class="status-bar">
  <span>9:41</span>
  <div class="status-bar-right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4" y="5" width="3" height="7" rx="0.5"/><rect x="8" y="2" width="3" height="10" rx="0.5"/><rect x="12" y="0" width="3" height="12" rx="0.5"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M8 2C5 2 2.5 3.5 1 6c1.5 2.5 4 4 7 4s5.5-1.5 7-4c-1.5-2.5-4-4-7-4z" stroke="white" stroke-width="1" fill="none"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="1" fill="white"/><path d="M23.5 4v4a2 2 0 000-4z" fill="white" fill-opacity="0.4"/></svg>
  </div>
</div>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1612" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <span class="nav-title">Bug Whisperer</span>
  </div>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a8b6f" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 00-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 004 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
</div>

<div class="content">
  <!-- Magnifying Glass -->
  <div class="mag-container">
    <div class="mag-ring"></div>
    <div class="mag-ring"></div>
    <div class="mag-core">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8b7355" stroke-width="2" stroke-linecap="round" style="animation: pulse 2s ease-in-out infinite">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
    </div>
  </div>

  <!-- Steps -->
  <div class="steps">
    <div class="step step-done">
      <div class="step-dot"><span class="step-check">✓</span></div>
      Scanning the crime scene...
    </div>
    <div class="step step-active">
      <div class="step-dot"><div class="step-active-dot"></div></div>
      Reading the file system...
    </div>
    <div class="step step-pending">
      <div class="step-dot"><div class="step-circle"></div></div>
      Cross-referencing evidence...
    </div>
    <div class="step step-pending">
      <div class="step-dot"><div class="step-circle"></div></div>
      Analyzing the root cause...
    </div>
  </div>

  <div class="loading-text">Investigating across 3 files...</div>
</div>

</body>
</html>
